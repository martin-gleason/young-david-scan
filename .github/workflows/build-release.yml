name: Build portable Windows .exe

# Builds the Court Document Cataloguer as a single-file Windows executable
# and uploads it as a workflow artifact. Triggered:
#   - on every push to main (so each merge produces a downloadable build)
#   - manually via "Run workflow" (workflow_dispatch)
#   - on tag push v* (also creates a Release with the zip attached)
#
# The build runs on windows-latest because PyInstaller is platform-specific
# (a Linux runner produces an ELF, not a .exe). After building, we run the
# .exe with --selftest on the runner itself to verify the bundle actually
# launches and that the native sqlcipher / pymupdf libs loaded — catches
# missing-DLL bugs that a green pyinstaller invocation alone would hide.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0

      - name: Build with PyInstaller (single-file)
        run: pyinstaller packaging/CourtDocCataloguer.spec --clean --noconfirm

      - name: Self-test the .exe
        # Runs the bundled app with --selftest, which imports sqlcipher3 +
        # fitz + tkinter + cryptography, exercises the SQLCipher round
        # trip, and runs the full first-run / unlock flow against a tmp
        # data dir. Fails the job if anything in the bundle is broken.
        #
        # We use Start-Process explicitly because the .exe is built with
        # console=False (Windows GUI subsystem). A bare `run:` invocation
        # under pwsh does NOT reliably propagate the exit code of a
        # windowed Win32 app — the previous build silently reported green
        # while the selftest was exiting with code 6. Start-Process -Wait
        # -PassThru returns a process object whose ExitCode we can check.
        shell: pwsh
        run: |
          $proc = Start-Process `
              -FilePath "dist/CourtDocCataloguer.exe" `
              -ArgumentList "--selftest" `
              -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput selftest.out `
              -RedirectStandardError selftest.err
          Write-Host "--- selftest stdout ---"
          if (Test-Path selftest.out) { Get-Content selftest.out }
          Write-Host "--- selftest stderr ---"
          if (Test-Path selftest.err) { Get-Content selftest.err }
          Write-Host "--- selftest exited with code $($proc.ExitCode) ---"
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::selftest failed with exit code $($proc.ExitCode)"
            exit $proc.ExitCode
          }

      - name: Stage the portable bundle
        # Drop the beta-tester README next to the .exe so the zip is
        # drag-and-drop onto a USB drive ready.
        shell: pwsh
        run: |
          Copy-Item BETA_TEST.md dist/README.txt -ErrorAction SilentlyContinue
          Get-ChildItem dist/ -Recurse | Select-Object -First 30

      - name: Zip the bundle
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CourtDocCataloguer.exe,dist/README.txt `
            -DestinationPath CourtDocCataloguer-portable.zip

      - name: Upload artifact (kept for 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: CourtDocCataloguer-portable
          path: CourtDocCataloguer-portable.zip
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CourtDocCataloguer-portable.zip
          generate_release_notes: true
